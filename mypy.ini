python_version = 3.12
plugins = pydantic.mypy
show_error_code_links = True
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True

# Config models that still have untyped validators or open type issues.
# Remove an entry once the module passes.
[mypy-scripts.lib.validation.config]
ignore_errors = True

[mypy-scripts.lib.validation.config._base,scripts.lib.validation.config._schema,scripts.lib.validation.config.atlite,scripts.lib.validation.config.clustering,scripts.lib.validation.config.co2_budget,scripts.lib.validation.config.conventional,scripts.lib.validation.config.sector,scripts.lib.validation.config.solving]
ignore_errors = True
