name: battery_inverter
description: the charger and the discharger of a battery, which share one bidirectional inverter
parameters:
  bus:
  store_bus:
  charger_carrier:
  discharger_carrier:
  charger_efficiency:
  discharger_efficiency:
  charger_capital_cost: 0.0
  charger_marginal_cost: 0.0
  discharger_marginal_cost: 0.0
  lifetime:
  charger_ratio: 1.0
components:
  Link:
    charger:
      bus0: $bus
      bus1: $store_bus
      carrier: $charger_carrier
      efficiency: $charger_efficiency
      capital_cost: $charger_capital_cost
      marginal_cost: $charger_marginal_cost
      p_nom_extendable: true
      lifetime: $lifetime
    discharger:
      bus0: $store_bus
      bus1: $bus
      carrier: $discharger_carrier
      efficiency: $discharger_efficiency
      marginal_cost: $discharger_marginal_cost
      p_nom_extendable: true
      lifetime: $lifetime
math:
  constraints:
    battery_inverter_rating:
      description: an extendable charger is rated at `charger_ratio` times its extendable discharger
      dims: [scenario, battery_inverter]
      where: >-
        at(Link_p_nom_extendable, by=battery_inverter_members[charger])
        AND at(Link_p_nom_extendable, by=battery_inverter_members[discharger])
      expression: >-
        at(Link_p_nom_effective, by=battery_inverter_members[charger])
        == battery_inverter_charger_ratio * at(Link_p_nom_effective, by=battery_inverter_members[discharger])
