parameters:
  Generator_solar_land_use:
    description: >-
      the land one unit of capacity takes, relative to fixed-tilt solar. No
      value for a generator outside the solar potential
    dims: [Generator]
    missing: absent

relations:
  Generator_solar_potential:
    description: the solar potential of its bus that a generator's land counts towards
    key: Generator
    values: global_constraint
    missing: absent

expressions:
  GlobalConstraint_total:
    cases:
      solar_potential:
        when: GlobalConstraint_type == 'solar_potential'
        expression: >-
          sum(Generator_solar_land_use * Generator_p_nom_ext, over=Generator,
          by=Generator_solar_potential[global_constraint])
