relations:
  Generator_SAFE:
    description: the reserve margin a conventional generator's capacity counts towards
    key: Generator
    values: global_constraint
    missing: absent

expressions:
  GlobalConstraint_total:
    cases:
      SAFE:
        when: GlobalConstraint_type == 'SAFE'
        expression: sum(Generator_p_nom_effective, over=Generator, by=Generator_SAFE[global_constraint])
