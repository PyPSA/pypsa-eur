parameters:
  Link_import_efficiency:
    description: the fuel an importing link delivers per unit of its power
    dims: [Link]
    missing: absent

relations:
  Generator_import_limit:
    description: the import limit an importing generator counts towards
    key: Generator
    values: global_constraint
    missing: absent
  Link_import_limit:
    description: the import limit an importing link counts towards, with the fuel it delivers
    key: Link
    values: global_constraint
    missing: absent

expressions:
  GlobalConstraint_total:
    cases:
      import_limit:
        when: GlobalConstraint_type == 'import_limit'
        expression: >-
          sum(sum(Generator_p * snapshot_weighting_generators, over=snapshot),
          over=Generator, by=Generator_import_limit[global_constraint])
          + sum(sum(Link_p * Link_import_efficiency * snapshot_weighting_generators, over=snapshot),
          over=Link, by=Link_import_limit[global_constraint])
