# yaml-language-server: $schema=../schema.default.json
#
# Test case for the residential DR thesis
# Belgium, 5 buses, one full year, hourly, operations only (fixed capacities)
# Needs more RAM than a laptop (run on solstorm); scaled up from a one-week
# version (see this file's git history for that smaller, laptop-sized config).
#
# Written for PyPSA-Eur v2026.09.0
#
# Run from the pypsa-eur folder inside pixi shell:
#   snakemake -call results/dr-test/networks/solved_2025.nc --configfile config/test/config.dr-test.yaml
#
# Then open the result in Python:
#   import pypsa
#   n = pypsa.Network("results/dr-test/networks/solved_2025.nc")
#   n.loads, n.stores, n.statistics()

tutorial: true            # uses the small tutorial data bundles (fast download)

run:
  name: dr-test
  scenarios:
    enable: false         # switch to true once the DR config block exists (see bottom)
    file: config/scenarios.dr.yaml
  disable_progressbar: true
  shared_resources:
    policy: false

foresight: overnight
planning_horizons:
- 2025                    # model year still open (2022 / 2024 / 2025), change when decided

# ---------- space and time ----------

countries:
- BE

# snapshots: not overridden - inherits config.default.yaml's full year
# (2013-01-01 to 2014-01-01), matching the atlite cutout below.

clustering:
  cluster_network:
    n_clusters: 5
  temporal:
    averaging: false      # IMPORTANT: keep hourly, otherwise DR shift times lose meaning

# ---------- weather (atlite) ----------
# atlite: not overridden - inherits config.default.yaml's standard, pre-built
# full-Europe, full-year cutout ("europe-2013-sarah3-era5"). The one-week
# test's custom be-03-2013-era5 cutout only covers that one week - cutouts are
# pre-built archive files fetched by exact name, not built from config fields,
# so there's no "just widen the time range" option. This is a much bigger
# download than the one-week cutout, but it's the same file every other
# PyPSA-Eur run already uses.

# ---------- operations only: no new investments ----------

electricity:
  extendable_carriers:    # existing fleet only, EXCEPT extra gas in this test:
    Generator: [CCGT]     # Belgium alone can't cover demand, so extra CCGT fills the gaps
                          # instead of load shedding. Remove for operations-only runs.
                          # (Only works for technologies Belgium already has, so not OCGT.)
    StorageUnit: []
    Store: []
    Link: []
  transmission_limit: v1.0   # grid kept at today's size
  # renewable_carriers: not overridden - now matches config.default.yaml's
  # default list exactly (hydro needs a full year, which this run now has).
  estimate_renewable_capacities:
    enable: true          # existing wind and solar from IRENA statistics
    from_powerplantmatching: true
    year: 2020
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar

co2_budget:
  relative: false
  upper:                  # no CO2 cap; a cap plus fixed capacity can make it infeasible

conventional:
  dynamic_fuel_price: false
  unit_commitment: false

# ---------- solver ----------

solving:
  solver:
    name: highs           # free solver for the test; use gurobi for the full runs
    options: highs-default
  options:
    transmission_losses: false
    load_shedding:
      enable: true        # safety valve so the test never turns infeasible
      default_cost: 100000   # €/MWh, high so it is only used if truly needed

sector:
  enabled: false          # electricity only

# ---------- demand response ----------
# Real O'Reilly et al. data (see prepare_dr_data.py / config_dr.yaml); the
# full device list, shift times and directions are inherited from
# config/config.default.yaml's load.demand_response.devices.

load:
  demand_response:
    enable: true
