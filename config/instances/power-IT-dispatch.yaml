# yaml-language-server: $schema=schema.default.json

run:
  prefix: "dispatch-power-IT"
  name: all
  scenarios:
    enable: true
    file: config/instances/scenarios/scenarios-power.yaml
  disable_progressbar: true
  shared_resources:
    policy: false
    exclude: []
  use_shadow_directory: false

foresight: overnight

scenario:
  clusters:
  - 2
  - 20
  - 50
  opts:
  - ''

countries:
- IT

electricity:
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []
  transmission_limit: v1.0

clustering:
  temporal:
    resolution_elec: 48c24

solving:
  options:
    load_shedding: 
      enable: true
    skip_iterations: true
    transmission_losses: 0
    linearized_unit_commitment: false
    noisy_costs: false
  solver:
    name: [gurobi, smspp, smspp]
    options: [gurobi-default, smspp-ucblock, smspp-investmentblock]
  solver_options:
    smspp-ucblock:
      capacity_expansion_ucblock: true
      configfile: "UCBlock/uc_solverconfig_grb.txt"
    smspp-investmentblock:
      capacity_expansion_ucblock: false
    smspp-ucblock-DP:
      capacity_expansion_ucblock: true
      enable_thermal_units: true
      configfile: "config/smspp/Thermal_DynamicProgramming/TUBSCfg-DP.txt"
      pysmspp_options:
        "B": "config/smspp/Thermal_DynamicProgramming/TUBCfg-DP.txt"
  runtime: 12H
